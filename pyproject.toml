[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "search-gateway"
dynamic = ["version"]
description = "Bespoke unified web-search & research MCP server: SearXNG + Exa + agent-reach platform channels, fused and re-ranked."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0,<4",
    "httpx>=0.27",
    "redis>=5.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.24",
    "numpy>=1.24",
    "optimum[onnxruntime]",
    "onnxruntime",
]

[project.scripts]
search-gateway = "search_gateway.cli:main"

[project.optional-dependencies]
report = [
    "matplotlib",
    "weasyprint",
    "python-docx",
    "playwright",
]

[tool.setuptools]
packages = ["search_gateway", "search_gateway.sources"]

[tool.setuptools.dynamic]
version = { attr = "search_gateway.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: requires downloaded models"]
