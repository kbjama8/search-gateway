[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kortex-search"
dynamic = ["version"]
description = "Bespoke unified web-search & research MCP server: SearXNG + Exa + agent-reach platform channels, fused and re-ranked."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0,<4",
    "httpx>=0.27",
    "redis>=5.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "huggingface-hub>=0.24",
    "numpy>=1.24",
    "optimum[onnxruntime]",
    "onnxruntime",
    "trafilatura>=1.8",
    "readability-lxml>=0.8",
]

[project.scripts]
kortex-search = "kortex_search.cli:main"

[project.optional-dependencies]
report = [
    "matplotlib",
    "weasyprint",
    "python-docx",
    "playwright",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "fakeredis>=2.20",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["kortex_search", "kortex_search.sources"]

[tool.setuptools.dynamic]
version = { attr = "kortex_search.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: requires downloaded models"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# F = pyflakes (the documented "F-clean" bar), plus the pragmatic set the
# codebase already satisfies: E/W formatting, I imports, UP modern syntax,
# B bugbears, SIM simplify, RUF/FURB nits, S security, DTZ datetimes,
# BLE blind exceptions (with targeted noqas where intentional).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "FURB", "S", "DTZ", "BLE"]
ignore = ["S101"]  # asserts in tests are the point

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603"]  # fake tokens + fixed-argv subprocess calls in tests
