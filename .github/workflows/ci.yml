name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # nightly property sweep — non-deterministic bug hunt (two-kinds-of-testing)
    - cron: "17 3 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check kortex_search/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      # Real dependencies in CI: the smoke + handshake tests hit SearXNG and
      # the gateway's Redis state — "green" must prove something.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      searxng:
        image: searxng/searxng:latest
        ports: ["8888:8080"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (with test extras)
        run: pip install -e ".[test]"
      - name: Test (fast)
        run: python -m pytest -m "not slow" -q
      - name: Coverage gate (≥85% package)
        run: python -m pytest --cov=kortex_search --cov-report=term-missing -m "not slow" -q --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build headless image
        run: docker build -f infra/Dockerfile -t kortex-search .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[test]"
      - name: Bandit scan
        run: pip install bandit && bandit -c pyproject.toml -r kortex_search -ll
      - name: Dependency audit
        # transformers is pinned <4.58 by optimum-onnx; the four RCE advisories
        # below fix only in 5.x. Mitigation: model loads use git-SHA-pinned
        # revisions of fixed trusted repos (content-addressed) — see
        # docs/security.md. torch>=2.13 clears PYSEC-2025-194.
        run: pip install pip-audit && pip-audit -l
            --ignore-vuln PYSEC-2025-217
            --ignore-vuln PYSEC-2026-2288
            --ignore-vuln PYSEC-2026-2289
            --ignore-vuln PYSEC-2026-2290
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sweep:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -e ".[test]"
      - name: Deep property sweep (non-deterministic hunt)
        run: HYPOTHESIS_PROFILE=sweep python -m pytest tests/test_properties.py
