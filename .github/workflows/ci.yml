name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check search_gateway/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      # Real dependencies in CI: the smoke + handshake tests hit SearXNG and
      # the gateway's Redis state — "green" must prove something.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      searxng:
        image: searxng/searxng:latest
        ports: ["8888:8080"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (with test extras)
        run: pip install -e ".[test]"
      - name: Test (fast)
        run: python -m pytest -m "not slow" -q
      - name: Coverage gate (≥85% package)
        run: python -m pytest --cov=search_gateway --cov-report=term-missing -m "not slow" -q --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build headless image
        run: docker build -f infra/Dockerfile -t search-gateway .
