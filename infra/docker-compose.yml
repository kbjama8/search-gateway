# Redis + SearXNG — the two service dependencies the kortex-search needs.
#
# The gateway itself runs as a **host process** (it shells out to CLIs +
# Chromium and uses a warm local model cache), so it is deliberately NOT a
# container here. See docs/deployment.md for the full tier model.
#
#   docker compose up -d      # brings up redis + searxng
#   kortex-search doctor     # confirm both report ok
#
# Security notes (2026-08-21 hardening pass):
#   - Redis now requires a password (M2): set REDIS_PASSWORD in your env
#     (e.g. `openssl rand -hex 32`) and point the gateway at it via
#     KORTEX_SEARCH_REDIS_URL=redis://:PASSWORD@127.0.0.1:6379/0.
#     Unauthenticated Redis allowed cache poisoning + rate-limit bypass.
#   - SearXNG secret_key is injected from the environment (M4) and its
#     limiter is on; the same password file holds SEARXNG_SECRET_KEY.

services:
  redis:
    image: redis:7-alpine
    # AOF so `saved_queries` (user state) survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://127.0.0.1:8888/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

volumes:
  redis-data:
